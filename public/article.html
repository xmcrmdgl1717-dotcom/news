<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 链安快讯</title>
    <style>
        :root {
            --bg-color: #0b0e14; --card-bg: #161b22; --text-main: #e6edf3;
            --text-muted: #8b949e; --accent-color: #f0b90b; --border-color: #30363d;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 24px; color: var(--accent-color); cursor: pointer; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: var(--accent-color); text-decoration: none; cursor: pointer; font-size: 14px; }
        
        .article-full { background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); }
        .article-full h1 { color: var(--accent-color); margin-top: 0; font-size: 28px; }
        .article-meta { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .article-body { font-size: 16px; line-height: 1.8; color: var(--text-main); }
        .article-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 onclick="window.location.href='/'">链安快讯</h1>
        </header>
        <a class="back-btn" onclick="history.back()">← Back</a>
        
        <div id="article-container" class="article-full">
            <p style="text-align:center;">Loading...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        const lang = urlParams.get('lang') || 'zh';

        async function loadArticle() {
            if (!articleId) {
                document.getElementById('article-container').innerHTML = '<p>Article not found</p>';
                return;
            }
            
            try {
                const res = await fetch(`/api/articles/${articleId}?lang=${lang}`);
                const article = await res.json();
                const container = document.getElementById('article-container');
                
                if (article.error || !article.id) {
                    container.innerHTML = `<p>Article not found</p>`;
                    return;
                }

                container.innerHTML = `
                    <h1>${article.title}</h1>
                    <div class="article-meta">
                        ${article.author} | ${article.time || new Date().toLocaleDateString()}
                    </div>
                    <div class="article-body">
                        ${article.content}
                    </div>
                `;
            } catch (e) {
                document.getElementById('article-container').innerHTML = '<p>Load failed</p>';
            }
        }

        loadArticle();
    </script>
</body>
</html>
