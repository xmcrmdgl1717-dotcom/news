<!-- 请只替换 <div id="tab-dashboard" class="content-section active"> 内部的内容 -->
<div id="tab-dashboard" class="content-section active">
    <!-- 顶部统计卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
        <div class="card p-4">
            <div class="text-xs text-gray-500 dark:text-slate-400 mb-1">总记录</div>
            <div class="text-2xl font-bold" id="statTotal">0</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-green-500 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> 已提交</div>
            <div class="text-2xl font-bold text-green-500" id="statSubmitted">0</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-gray-500 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-gray-500"></span> 未提交</div>
            <div class="text-2xl font-bold" id="statUnsubmitted">0</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-blue-500 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 安卓</div>
            <div class="text-2xl font-bold text-blue-500" id="statAndroid">0</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-purple-500 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-500"></span> 苹果</div>
            <div class="text-2xl font-bold text-purple-500" id="statIos">0</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-gray-500 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-gray-500"></span> 桌面</div>
            <div class="text-2xl font-bold" id="statDesktop">0</div>
        </div>
    </div>

    <!-- 筛选栏 (去掉状态选择) -->
    <div class="card p-4 mb-6 flex flex-wrap gap-3 items-center text-sm">
        <select class="input p-2 rounded w-32" id="filterDevice" onchange="applyFilters()">
            <option value="all">设备 (全部)</option>
            <option value="手机">手机</option>
            <option value="桌面">桌面</option>
        </select>
        <select class="input p-2 rounded w-32" id="filterCountry" onchange="applyFilters()">
            <option value="all">国家 (全部)</option>
            <option value="中国">中国</option>
            <option value="日本">日本</option>
            <option value="美国">美国</option>
        </select>
        <select class="input p-2 rounded w-32" id="filterOS" onchange="applyFilters()">
            <option value="all">系统 (全部)</option>
            <option value="Windows 10">Windows 10</option>
            <option value="Android">Android</option>
            <option value="iOS">iOS</option>
        </select>
        <select class="input p-2 rounded w-32" id="filterBrowser" onchange="applyFilters()">
            <option value="all">浏览器 (全部)</option>
            <option value="Chrome">Chrome</option>
            <option value="Safari">Safari</option>
        </select>
        <select class="input p-2 rounded w-32" id="filterLang" onchange="applyFilters()">
            <option value="all">语言 (全部)</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
        </select>
        <input type="text" id="searchInput" placeholder="IP / 地址 / 系统 / 浏览器 / 语言" class="input p-2 rounded flex-1 min-w-[200px]" onkeyup="if(event.key==='Enter') applyFilters()">
        <button onclick="applyFilters()" class="bg-blue-600 text-white px-5 py-2 rounded font-bold hover:bg-blue-700"><i class="fas fa-search"></i> 搜索</button>
        <button onclick="resetFilters()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded font-bold hover:bg-gray-300">重置</button>
    </div>

    <!-- 操作按钮 -->
    <div class="flex gap-2 mb-4">
        <button onclick="loadVisits()" class="bg-gray-100 text-gray-700 px-4 py-1.5 rounded text-sm hover:bg-gray-200 border border-gray-300"><i class="fas fa-sync"></i> 刷新</button>
        <button onclick="exportCSV()" class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded text-sm hover:bg-blue-200 border border-blue-300"><i class="fas fa-download"></i> 导出 CSV (当前筛选)</button>
        <button onclick="deleteVisits()" class="bg-red-100 text-red-700 px-4 py-1.5 rounded text-sm hover:bg-red-200 border border-red-300"><i class="fas fa-trash"></i> 批量删除选中</button>
        <div class="flex-1 text-right text-xs text-gray-500 pt-2">共 <span id="filteredCount">0</span> 条 (已筛选)</div>
    </div>

    <div class="space-y-3" id="visitsList"></div>
</div>
