<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChainSafe CMS</title>
<script>
    // 防闪烁：尽早应用主题
    (function () {
        var t = localStorage.getItem('wad_theme') || 'dark';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(t);
    })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<style>
    /* ================= 全局光标与基础字体修复 ================= */
    * { 
        cursor: default; 
    }
    button, a, select, .menu-item, input[type="checkbox"], input[type="file"] { 
        cursor: pointer !important; 
    }
    input, textarea { 
        cursor: text !important; 
    }
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* ================= 强制修复暗黑模式下的表单样式 ================= */
    /* 强制覆盖默认的白色背景，确保暗黑模式下输入框也是深色 */
    .dark .input {
        background-color: #0d1117 !important;
        color: #e6edf3 !important;
        border: 1px solid #30363d !important;
    }
    .dark .input:focus {
        border-color: #f0b90b !important;
        outline: none;
        box-shadow: 0 0 0 1px #f0b90b;
    }
    .light .input {
        background-color: #f3f4f6 !important;
        color: #111827 !important;
        border: 1px solid #d1d5db !important;
    }
    .light .input:focus {
        border-color: #3b82f6 !important;
        outline: none;
        box-shadow: 0 0 0 1px #3b82f6;
    }

    /* ================= 卡片与文字对比度修复 ================= */
    .card { 
        @apply bg-white dark:bg-[#161b22] border border-gray-200 dark:border-slate-700 rounded-xl shadow-lg text-gray-900 dark:text-gray-100 transition-colors duration-300; 
    }
    /* 确保表格头部和文字在深色背景下看得清 */
    .dark th { color: #8b949e !important; font-weight: bold; }
    .dark td { color: #e6edf3 !important; }
    
    /* ================= 侧边栏与菜单 ================= */
    .sidebar { 
        @apply bg-white dark:bg-[#0f172a] border-r border-gray-200 dark:border-slate-700; 
    }
    .menu-item { 
        @apply text-gray-600 dark:text-gray-300 transition-colors duration-200 border-r-4 border-transparent; 
    }
    .menu-item:hover { 
        @apply bg-gray-100 dark:bg-slate-800; 
    }
    .menu-item.active { 
        @apply bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-[#f0b90b] border-blue-600 dark:border-[#f0b90b] font-bold; 
    }

    /* ================= 页面切换 ================= */
    .content-section { display: none; }
    .content-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ================= Quill 编辑器样式优化 ================= */
    .ql-toolbar { 
        @apply bg-gray-100 dark:bg-gray-800 border-gray-300 dark:border-slate-700 rounded-t-lg; 
    }
    .ql-container { 
        @apply bg-white text-black border-gray-300 dark:border-slate-700 rounded-b-lg; 
        min-height: 300px; 
    }

    /* ================= 弹窗控制 ================= */
    .modal { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
</style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-50 dark:bg-[#0b0e14] transition-colors duration-300">

    <!-- 登录遮罩 -->
    <div id="loginOverlay" class="absolute inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="card p-8 w-96 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600 dark:text-[#f0b90b]">ChainSafe CMS</h2>
            <input type="password" id="adminPwd" placeholder="请输入后台密码" class="input w-full mb-4 p-3">
            <button onclick="doLogin()" class="w-full bg-blue-600 dark:bg-[#f0b90b] text-white dark:text-black py-3 rounded-lg font-bold hover:opacity-90 transition">登录</button>
        </div>
    </div>

    <!-- 侧边栏 -->
    <aside class="w-64 sidebar flex flex-col hidden md:flex z-10 relative">
        <div class="h-16 flex items-center justify-between px-6 font-bold text-xl text-blue-600 dark:text-[#f0b90b] border-b border-gray-200 dark:border-slate-700">
            <span>ChainSafe CMS</span>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white" title="切换主题">
                <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 py-4 overflow-y-auto space-y-1">
            <div class="menu-item px-6 py-3 active" onclick="switchTab('dashboard', this)" data-i18n="navDashboard">📊 数据汇总</div>
            <div class="menu-item px-6 py-3" onclick="switchTab('articles', this)" data-i18n="navArticles">📝 文章管理</div>
            <div class="menu-item px-6 py-3" onclick="switchTab('categories', this)" data-i18n="navCategories">📁 板块管理</div>
            <div class="menu-item px-6 py-3" onclick="switchTab('languages', this)" data-i18n="navLanguages">🌐 多语言管理</div>
            <div class="menu-item px-6 py-3" onclick="switchTab('translogs', this)" data-i18n="navTranslogs">📈 翻译汇总</div>
            <div class="menu-item px-6 py-3" onclick="switchTab('settings', this)" data-i18n="navSettings">⚙️ 系统设置</div>
        </nav>
        
        <div class="p-4 border-t border-gray-200 dark:border-slate-700 space-y-2">
            <button onclick="openChangePwd()" class="w-full bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-slate-700 transition" data-i18n="changePwd">修改密码</button>
            <button onclick="logout()" class="w-full bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 py-2 rounded-lg font-medium hover:bg-red-100 dark:hover:bg-red-900/50 transition" data-i18n="logout">退出登录</button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-6 bg-white dark:bg-[#0f172a] transition-colors">
            <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100" id="pageTitle" data-i18n="pageDashboard">数据汇总</h2>
            <div class="flex items-center gap-4">
                <button onclick="toggleAdminLang()" class="text-sm px-3 py-1.5 rounded-lg border border-gray-300 dark:border-slate-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 transition font-bold">
                    <span id="adminLangLabel">EN</span>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6" id="mainContent">
            
            <!-- 0. 数据汇总 -->
            <div id="tab-dashboard" class="content-section active">
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div class="card p-6 border-l-4 border-blue-500 dark:border-[#f0b90b]">
                        <div class="text-sm font-bold text-gray-500 dark:text-gray-300 mb-1" data-i18n="statTotal">总文章记录数 (全语言)</div>
                        <div class="text-3xl font-bold" id="statTotal">0</div>
                    </div>
                    <div id="categoryStats" class="col-span-2 grid grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- 1. 文章管理 -->
            <div id="tab-articles" class="content-section">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <h3 class="font-bold text-lg mb-4 text-blue-600 dark:text-[#f0b90b]" data-i18n="publishArticle">发布新文章</h3>
                        <div class="space-y-4 mb-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-600 dark:text-gray-300 mb-1" data-i18n="labelCategory">所属板块</label>
                                <select id="artType" class="input w-full"></select>
                            </div>
                            <div class="border border-gray-200 dark:border-slate-700 p-3 rounded bg-gray-50 dark:bg-[#0b1120]">
                                <p class="text-sm font-bold text-gray-600 dark:text-gray-300 mb-2" data-i18n="labelLangs">发布语言（勾选后自动机翻）：</p>
                                <div class="flex gap-4 flex-wrap" id="articleLangCheckboxes"></div>
                            </div>
                            <input type="text" id="artTitle" placeholder="源标题" class="input w-full" data-i18n-placeholder="phTitle">
                            <textarea id="artSummary" placeholder="源摘要" class="input w-full" rows="2" data-i18n-placeholder="phSummary"></textarea>
                            <div class="bg-white rounded-lg"><div id="editor-container"></div></div>
                        </div>
                        <button onclick="submitArticle()" id="articleSubmitBtn" class="bg-blue-600 dark:bg-[#f0b90b] text-white dark:text-black px-6 py-2 rounded font-bold hover:opacity-90 transition" data-i18n="btnPublish">智能翻译并发布</button>
                    </div>

                    <div class="card p-6 overflow-y-auto" style="max-height: calc(100vh - 150px);">
                        <h3 class="font-bold text-lg mb-4" data-i18n="publishedArticles">已发布文章</h3>
                        <div id="articleList" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 板块管理 -->
            <div id="tab-categories" class="content-section">
                <div class="card p-6 mb-6">
                    <h3 class="font-bold text-lg mb-4" data-i18n="addCategoryTitle">添加新板块</h3>
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <input type="text" id="newCatId" placeholder="ID (如: defi)" class="input">
                        <input type="text" id="newCatZh" placeholder="中文名" class="input">
                        <input type="text" id="newCatEn" placeholder="英文名" class="input">
                    </div>
                    <button onclick="addCategory()" class="bg-blue-600 dark:bg-[#f0b90b] text-white dark:text-black px-6 py-2 rounded font-bold hover:opacity-90 transition" data-i18n="btnAdd">添加</button>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-[#0b1120] border-b border-gray-200 dark:border-slate-700">
                            <tr><th class="p-4" data-i18n="thId">ID</th><th class="p-4" data-i18n="thZhName">中文名</th><th class="p-4" data-i18n="thEnName">英文名</th><th class="p-4" data-i18n="thAction">操作</th></tr>
                        </thead>
                        <tbody id="categoryList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 多语言管理 -->
            <div id="tab-languages" class="content-section">
                <div class="card p-6 mb-6">
                    <h3 class="font-bold text-lg mb-4" data-i18n="addLangTitle">添加新语言</h3>
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <input type="text" id="newLangCode" placeholder="代码 (如 fr)" class="input">
                        <input type="text" id="newLangName" placeholder="名称" class="input">
                        <input type="text" id="newLangFlag" placeholder="国旗 (如 🇫🇷)" class="input">
                    </div>
                    <button onclick="addLanguage()" class="bg-blue-600 dark:bg-[#f0b90b] text-white dark:text-black px-6 py-2 rounded font-bold hover:opacity-90 transition" data-i18n="btnAdd">添加</button>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-[#0b1120] border-b border-gray-200 dark:border-slate-700">
                            <tr><th class="p-4" data-i18n="thCode">代码</th><th class="p-4" data-i18n="thName">名称</th><th class="p-4" data-i18n="thStatus">状态</th><th class="p-4" data-i18n="thAction">操作</th></tr>
                        </thead>
                        <tbody id="languageList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. 翻译汇总 -->
            <div id="tab-translogs" class="content-section">
                <div class="grid grid-cols-2 gap-6 mb-6">
                    <div class="card p-6"><div class="text-sm font-bold text-gray-500 dark:text-gray-300" data-i18n="transCount">总翻译次数</div><div class="text-3xl font-bold text-blue-500" id="logTotalCount">0</div></div>
                    <div class="card p-6"><div class="text-sm font-bold text-gray-500 dark:text-gray-300" data-i18n="transChars">总消耗字符</div><div class="text-3xl font-bold text-green-500" id="logTotalChars">0</div></div>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-[#0b1120] border-b border-gray-200 dark:border-slate-700">
                            <tr><th class="p-4" data-i18n="thTime">时间</th><th class="p-4" data-i18n="thTargetLang">目标语言</th><th class="p-4" data-i18n="thChars">消耗字符</th></tr>
                        </thead>
                        <tbody id="translationLogList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 5. 系统设置 -->
            <div id="tab-settings" class="content-section">
                <div class="card p-6 max-w-2xl mb-6">
                    <h3 class="font-bold text-lg mb-4" data-i18n="settingsTitle">语言与翻译配置</h3>
                    
                    <div class="flex items-center justify-between border-b border-gray-200 dark:border-slate-700 pb-4 mb-4">
                        <div>
                            <div class="font-bold text-gray-800 dark:text-gray-200" data-i18n="autoLang">自动 IP 识别语言</div>
                            <div class="text-sm text-gray-500 dark:text-gray-400" data-i18n="autoLangDesc">开启后，用户首次访问将根据 IP 自动选择对应语言</div>
                        </div>
                        <input type="checkbox" id="autoLangSwitch" class="w-5 h-5 accent-blue-600 dark:accent-[#f0b90b]">
                    </div>

                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-600 dark:text-gray-300 mb-1">DeepL API Key 1 (主)</label>
                            <input type="text" id="deeplKey1" class="input w-full" placeholder="例如: xxxx:fx">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-600 dark:text-gray-300 mb-1">DeepL API Key 2 (备用轮询)</label>
                            <input type="text" id="deeplKey2" class="input w-full" placeholder="例如: xxxx:fx">
                        </div>
                    </div>
                    <button onclick="saveSettings()" class="bg-blue-600 dark:bg-[#f0b90b] text-white dark:text-black px-6 py-2 rounded font-bold hover:opacity-90 transition" data-i18n="btnSaveConfig">保存配置</button>
                </div>
            </div>

        </div>
    </main>

    <!-- 字典编辑弹窗 -->
    <div id="editLangModal" class="modal">
        <div class="card p-6 w-full max-w-4xl max-h-[90vh] flex flex-col">
            <h3 class="font-bold text-lg mb-4 text-blue-600 dark:text-[#f0b90b]" data-i18n="editDictTitle">编辑语言字典 JSON</h3>
            <input type="hidden" id="editLangCode">
            <textarea id="editLangDict" class="input w-full flex-1 p-3 font-mono text-sm mb-4" rows="15"></textarea>
            <div class="flex gap-2 justify-end">
                <button onclick="saveLangDict()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition" data-i18n="btnSave">保存</button>
                <button onclick="document.getElementById('editLangModal').classList.remove('active')" class="bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-white px-6 py-2 rounded font-bold hover:bg-gray-300 dark:hover:bg-slate-600 transition" data-i18n="btnCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="changePwdModal" class="modal">
        <div class="card p-6 w-96">
            <h3 class="font-bold text-lg mb-4" data-i18n="changePwdTitle">修改后台密码</h3>
            <input type="password" id="newPwdInput" placeholder="输入新密码" class="input w-full mb-4" data-i18n-placeholder="phNewPwd">
            <div class="flex gap-2">
                <button onclick="savePassword()" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition" data-i18n="btnSave">保存</button>
                <button onclick="document.getElementById('changePwdModal').classList.remove('active')" class="flex-1 bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-white py-2 rounded font-bold hover:bg-gray-300 dark:hover:bg-slate-600 transition" data-i18n="btnCancel">取消</button>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
