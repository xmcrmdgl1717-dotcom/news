<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链安快讯 - Web3安全资讯</title>
    <style>
        /* ================= 基础样式与暗黑模式 ================= */
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent-color: #f0b90b;
            --danger-color: #ff4d4f;
            --safe-color: #52c41a;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            padding-bottom: 220px; /* 为悬浮窗留出空间 */
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* ================= 顶部导航（重构结构修复对齐） ================= */
        header { 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; /* 允许在极小屏幕下换行 */
            gap: 15px; 
        }
        header h1 { 
            margin: 0; 
            font-size: 24px; 
            color: var(--accent-color); 
            cursor: pointer; 
        }
        
        /* 将导航和语言选择器放在一起 */
        header nav { 
            display: flex; 
            align-items: center; 
            gap: 15px; /* 统一的间距 */
            flex-wrap: wrap;
        }
        
        /* 语言选择器样式，与其他链接完美对齐 */
        #langSelect { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 4px 8px; 
            border-radius: 6px; 
            outline: none; 
            font-size: 14px; 
            cursor: pointer; 
            margin-right: 5px; /* 距离“首页”稍微多一点点间距 */
        }
        #langSelect:focus { border-color: var(--accent-color); }

        header nav a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 15px; 
            cursor: pointer; 
            transition: color 0.3s; 
        }
        header nav a:hover, header nav a.active { 
            color: var(--accent-color); 
            font-weight: bold; 
        }

        /* 页面切换控制 */
        .page-view { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 新闻卡片 */
        .news-card { background-color: var(--card-bg); border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .news-card:hover { border-color: var(--accent-color); }
        .news-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .news-title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; color: var(--text-main); }
        .news-content { display: flex; gap: 15px; }
        .news-image { width: 120px; height: 80px; border-radius: 4px; background-color: #21262d; display:flex; align-items:center; justify-content:center; font-size:12px; color:#555; flex-shrink: 0; }
        .news-desc { font-size: 14px; color: var(--text-muted); margin: 0; flex: 1; }

        /* 筛选 Tabs (动态渲染) */
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-tab { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-tab.active, .filter-tab:hover { background-color: rgba(240, 185, 11, 0.1); border-color: var(--accent-color); color: var(--accent-color); }

        /* 链上追踪面板样式 */
        .track-card { background-color: var(--card-bg); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); border-left: 4px solid var(--danger-color); }
        .track-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .track-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 77, 79, 0.2); color: var(--danger-color); }
        .track-address { font-family: monospace; color: var(--accent-color); font-size: 14px; word-break: break-all; margin-bottom: 10px; }
        .track-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }
        .track-btn-group { display: flex; gap: 10px; }
        .track-btn { flex: 1; text-align: center; padding: 8px; background: #21262d; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-main); font-size: 12px; cursor: pointer; }
        .track-btn:hover { background: #30363d; }

        /* 加载提示区 */
        .loading-more { text-align: center; padding: 20px; color: var(--accent-color); font-size: 14px; display: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(240, 185, 11, 0.3); border-radius: 50%; border-top-color: var(--accent-color); animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-more { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; display: none; }

        /* ================= 悬浮安全检测模块 ================= */
        .floating-tool {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--accent-color); box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100; padding: 12px 15px; box-sizing: border-box;
        }
        .tool-inner { max-width: 800px; margin: 0 auto; }
        .tool-default { display: flex; flex-direction: column; gap: 8px; }
        .tool-title { color: var(--accent-color); font-size: 14px; font-weight: bold; }
        .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .input-group input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #0d1117; color: white; outline: none; font-size: 14px; }
        .input-group input:focus { border-color: var(--accent-color); }
        .input-group button { width: 100%; box-sizing: border-box; padding: 10px; border: none; border-radius: 6px; background-color: var(--accent-color); color: #000; font-weight: bold; cursor: pointer; font-size: 14px; }
        .input-group button:disabled { background-color: #555; cursor: not-allowed; }
        
        .tool-loading, .tool-result { display: none; flex-direction: column; gap: 10px; padding: 10px 0; font-size: 14px; }
        .progress-bar { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-inner { height: 100%; width: 0%; background-color: var(--accent-color); transition: width 0.3s; }
        .tool-result { padding: 12px; border-radius: 6px; }
        .res-safe { background-color: rgba(82, 196, 26, 0.1); border: 1px solid var(--safe-color); color: var(--safe-color); }
        .res-danger { background-color: rgba(255, 77, 79, 0.1); border: 1px solid var(--danger-color); color: var(--danger-color); }
        .close-btn { cursor: pointer; color: var(--text-muted); font-size: 12px; text-align: right; text-decoration: underline; margin-top: 5px; }
        .close-btn:hover { color: white; }
        .disclaimer { font-size: 10px; color: #484f58; margin-top: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航 -->
    <header>
        <!-- 左侧 Logo -->
        <h1 onclick="switchPage('home')" data-i18n="siteTitle">链安快讯</h1>
        
        <!-- 右侧导航与语言 -->
        <nav id="navMenu">
            <!-- 语言选择器放在“首页”左边 -->
            <select id="langSelect"></select>
            <a class="nav-link active" onclick="switchPage('home')" data-i18n="navHome">首页</a>
            <a class="nav-link" onclick="switchPage('events')" data-i18n="navEvents">安全事件</a>
            <a class="nav-link" onclick="switchPage('track')" data-i18n="navTrack">链上追踪</a>
        </nav>
    </header>

    <!-- ================= 页面1：首页 ================= -->
    <div id="page-home" class="page-view active">
        <div id="home-list"></div>
        <div class="loading-more" id="home-loading"><span class="spinner"></span><span data-i18n="loading">正在加载...</span></div>
        <div class="no-more" id="home-nomore" data-i18n="noMore">—— 已经到底啦 ——</div>
    </div>

    <!-- ================= 页面2：安全事件 ================= -->
    <div id="page-events" class="page-view">
        <div class="filter-tabs" id="filter-tabs-container"></div>
        <div id="events-list"></div>
        <div class="loading-more" id="events-loading"><span class="spinner"></span><span data-i18n="loading">正在加载...</span></div>
        <div class="no-more" id="events-nomore" data-i18n="noMore">—— 已经到底啦 ——</div>
    </div>

    <!-- ================= 页面3：链上追踪 ================= -->
    <div id="page-track" class="page-view">
        <div class="track-card">
            <div class="track-header">
                <span style="font-weight:bold; color:white;" data-i18n="trackLazarus">Lazarus Group (朝鲜黑客)</span>
                <span class="track-tag" data-i18n="tagFBI">FBI 通缉</span>
            </div>
            <div class="track-address">0x098B716B8Aaf21512996dC57EB0615e2383E2f96</div>
            <div class="track-desc" data-i18n="trackLazarusDesc">近期异动：该地址在 2 小时前将 1,200 ETH 转移至 Tornado Cash 混币器。</div>
            <div class="track-btn-group">
                <div class="track-btn" onclick="alert('Added to watchlist')" data-i18n="btnMonitor">加入监控</div>
                <div class="track-btn" onclick="alert('Address copied')" data-i18n="btnCopy">复制地址</div>
            </div>
        </div>
    </div>
</div>

<!-- 悬浮底部的安全检测模块 -->
<div class="floating-tool">
    <div class="tool-inner">
        <div class="tool-default" id="toolDefault">
            <div class="tool-title" data-i18n="toolTitle">🛡️ 链上地址安全检测</div>
            <div class="input-group">
                <input type="text" id="walletAddress" data-i18n-placeholder="toolPlaceholder" placeholder="输入钱包地址...">
                <button id="checkBtn" onclick="startCheck()" data-i18n="toolBtn">立即检测</button>
            </div>
        </div>
        <div class="tool-loading" id="toolLoading">
            <span style="color: var(--accent-color);" data-i18n="toolLoading">正在比对链上黑名单数据库...</span>
            <div class="progress-bar"><div class="progress-inner" id="progressInner"></div></div>
        </div>
        <div class="tool-result" id="toolResult">
            <div id="resultText" style="line-height: 1.5;"></div>
            <div class="close-btn" onclick="resetTool()" data-i18n="toolReset">重新输入检测 ✕</div>
        </div>
        <p class="disclaimer" data-i18n="toolDisc">* 本模块为前端安全演示UI。</p>
    </div>
</div>

<script>
    // 兜底字典（防止后台字典缺失导致白屏）
    const fallbackDict = {
        zh: {
            siteTitle: "链安快讯", navHome: "首页", navEvents: "安全事件", navTrack: "链上追踪",
            loading: "正在加载...", noMore: "—— 已经到底啦 ——", noData: "暂无相关数据",
            catAll: "全部事件", tagFBI: "FBI 通缉", trackLazarus: "Lazarus Group (朝鲜黑客)",
            trackLazarusDesc: "近期异动：该地址在 2 小时前将 1,200 ETH 转移至 Tornado Cash 混币器。",
            btnMonitor: "加入监控", btnCopy: "复制地址", toolTitle: "🛡️ 链上地址安全检测", 
            toolPlaceholder: "输入 ETH / BTC / TRC20 钱包地址...", toolBtn: "立即检测", 
            toolLoading: "正在比对链上黑名单数据库...", toolReset: "重新输入检测 ✕",
            toolDisc: "* 本模块为前端安全演示UI，检测结果由随机算法生成。",
            resSafe: "✅ 安全", resSafeDesc: "该地址暂未发现与黑客、暗网、混币器存在交互记录。",
            resDanger: "❌ 高危警告", resDangerDesc: "该地址疑似黑客关联地址，请立即停止与其交互！"
        },
        en: {
            siteTitle: "ChainSafe News", navHome: "Home", navEvents: "Security", navTrack: "Tracking",
            loading: "Loading...", noMore: "—— No more data ——", noData: "No data available",
            catAll: "All Events", tagFBI: "FBI Wanted", trackLazarus: "Lazarus Group",
            trackLazarusDesc: "Recent Activity: The address moved 1,200 ETH to Tornado Cash 2 hours ago.",
            btnMonitor: "Monitor", btnCopy: "Copy Address", toolTitle: "🛡️ On-chain Security Check", 
            toolPlaceholder: "Enter address...", toolBtn: "Check Now", toolLoading: "Comparing with blacklists...", 
            toolReset: "Check Again ✕", toolDisc: "* This is a frontend demo.",
            resSafe: "✅ Safe", resSafeDesc: "No interactions with known hackers, darknets, or mixers found.",
            resDanger: "❌ High Risk", resDangerDesc: "Address is suspected to be linked to hackers. Stop interaction immediately!"
        }
    };

    let currentLang = 'en';
    let currentLangDict = {}; 
    let availableLangs = [];  
    let allCategories = [];   

    let currentPage = 1;
    const pageSize = 5;
    let homeAllLoaded = false;
    let homeLoading = false;
    let eventsCurrentPage = 1;
    let eventsAllLoaded = false;
    let eventsLoading = false;
    let currentFilter = 'all';

    async function determineLanguage() {
        const manual = localStorage.getItem('user_lang');
        if (manual) return manual;

        try {
            const res = await fetch('/api/settings');
            const settings = await res.json();
            if (settings.autoLang) {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                if (['CN', 'TW', 'HK'].includes(ipData.country_code)) return 'zh';
            }
        } catch (e) { console.log('IP检测失败'); }

        if (navigator.language.startsWith('zh')) return 'zh';
        return 'en';
    }

    function renderLangSelect() {
        const select = document.getElementById('langSelect');
        const activeLangs = availableLangs.filter(l => l.active);
        
        select.innerHTML = activeLangs.map(l => 
            `<option value="${l.code}">${l.flag} ${l.name}</option>`
        ).join('');

        if (activeLangs.find(l => l.code === currentLang)) {
            select.value = currentLang;
        } else {
            currentLang = activeLangs[0]?.code || 'en';
            select.value = currentLang;
        }
    }

    function updateText() {
        const langData = availableLangs.find(l => l.code === currentLang);
        const backendDict = langData?.dict || {};
        currentLangDict = Object.assign({}, fallbackDict['en'], fallbackDict[currentLang], backendDict);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (currentLangDict[key]) el.innerText = currentLangDict[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (currentLangDict[key]) el.placeholder = currentLangDict[key];
        });

        renderCategories();
    }

    async function init() {
        currentLang = await determineLanguage();

        try {
            const res = await fetch('/api/languages');
            availableLangs = await res.json();
            renderLangSelect();
        } catch (e) { console.error('拉取语言失败', e); }

        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('user_lang', currentLang);
            updateText();
            resetAndReload();
        });

        await fetchCategories();
        updateText();
        resetAndReload();
    }

    async function fetchCategories() {
        try {
            const res = await fetch('/api/categories');
            allCategories = await res.json();
        } catch (e) { console.error('获取分类失败'); }
    }

    function renderCategories() {
        const container = document.getElementById('filter-tabs-container');
        if(!container) return;
        
        let html = `<div class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="filterEvents(this, 'all')">${currentLangDict.catAll || 'All'}</div>`;
        
        allCategories.forEach(c => {
            const catName = currentLang === 'zh' ? c.name_zh : c.name_en;
            html += `<div class="filter-tab ${currentFilter === c.id ? 'active' : ''}" onclick="filterEvents(this, '${c.id}')">${catName}</div>`;
        });
        container.innerHTML = html;
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        
        document.getElementById('page-' + pageId).classList.add('active');
        const map = { 'home': 0, 'events': 1, 'track': 2 };
        document.querySelectorAll('.nav-link')[map[pageId]].classList.add('active');

        if (pageId === 'events' && document.getElementById('events-list').innerHTML === '') {
            loadEventsData();
        }
        window.scrollTo(0, 0);
    }

    function renderNewsCards(dataList, targetEl) {
        if (dataList.length === 0) {
            targetEl.innerHTML = `<div style="text-align:center; color:#8b949e; padding:20px;">${currentLangDict.noData || 'No data'}</div>`;
            return;
        }
        let html = '';
        dataList.forEach(item => {
            html += `
                <div class="news-card" onclick="window.location.href='/article.html?id=${item.id}&lang=${currentLang}'">
                    <div class="news-header"><span>${item.author}</span><span>${item.time || new Date().toLocaleDateString()}</span></div>
                    <h2 class="news-title">${item.title}</h2>
                    <div class="news-content">
                        <div class="news-image">${item.imageText || '[Image]'}</div>
                        <p class="news-desc">${item.desc || item.summary || ''}</p>
                    </div>
                </div>
            `;
        });
        targetEl.insertAdjacentHTML('beforeend', html);
    }

    function resetAndReload() {
        currentPage = 1; homeAllLoaded = false; homeLoading = false;
        eventsCurrentPage = 1; eventsAllLoaded = false; eventsLoading = false;
        
        document.getElementById('home-list').innerHTML = '';
        document.getElementById('events-list').innerHTML = '';
        document.getElementById('home-nomore').style.display = 'none';
        document.getElementById('events-nomore').style.display = 'none';
        
        loadHomeData();
        if (document.getElementById('page-events').classList.contains('active')) {
            loadEventsData();
        }
    }

    async function loadHomeData() {
        if (homeLoading || homeAllLoaded) return;
        homeLoading = true;
        document.getElementById('home-loading').style.display = 'block';

        try {
            const res = await fetch(`/api/articles?lang=${currentLang}&type=all`);
            let data = await res.json();
            
            const start = (currentPage - 1) * pageSize;
            const slicedData = data.slice(start, start + pageSize);
            
            if (slicedData.length > 0) {
                renderNewsCards(slicedData, document.getElementById('home-list'));
                currentPage++;
                if (start + pageSize >= data.length) {
                    homeAllLoaded = true;
                    document.getElementById('home-nomore').style.display = 'block';
                }
            } else {
                homeAllLoaded = true;
                document.getElementById('home-nomore').style.display = 'block';
            }
        } catch (e) { console.error(e); }
        
        document.getElementById('home-loading').style.display = 'none';
        homeLoading = false;
    }

    function filterEvents(el, type) {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        currentFilter = type;
        eventsCurrentPage = 1;
        eventsAllLoaded = false;
        document.getElementById('events-list').innerHTML = '';
        document.getElementById('events-nomore').style.display = 'none';
        loadEventsData();
    }

    async function loadEventsData() {
        if (eventsLoading || eventsAllLoaded) return;
        eventsLoading = true;
        document.getElementById('events-loading').style.display = 'block';

        try {
            const res = await fetch(`/api/articles?lang=${currentLang}&type=${currentFilter}`);
            let data = await res.json();

            const start = (eventsCurrentPage - 1) * pageSize;
            const slicedData = data.slice(start, start + pageSize);

            if (slicedData.length > 0) {
                renderNewsCards(slicedData, document.getElementById('events-list'));
                eventsCurrentPage++;
                if (start + pageSize >= data.length) {
                    eventsAllLoaded = true;
                    document.getElementById('events-nomore').style.display = 'block';
                }
            } else {
                eventsAllLoaded = true;
                document.getElementById('events-nomore').style.display = 'block';
            }
        } catch (e) { console.error(e); }

        document.getElementById('events-loading').style.display = 'none';
        eventsLoading = false;
    }

    window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const clientHeight = document.documentElement.clientHeight || document.body.clientHeight;
        const scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
        
        if (scrollTop + clientHeight >= scrollHeight - 200) {
            if (document.getElementById('page-home').classList.contains('active')) loadHomeData();
            else if (document.getElementById('page-events').classList.contains('active')) loadEventsData();
        }
    });

    const toolDefault = document.getElementById('toolDefault');
    const toolLoading = document.getElementById('toolLoading');
    const toolResult = document.getElementById('toolResult');
    const progressInner = document.getElementById('progressInner');
    const resultText = document.getElementById('resultText');

    function startCheck() {
        const input = document.getElementById('walletAddress').value.trim();
        if (input.length < 10) {
            alert(currentLang === 'zh' ? "请输入有效的钱包地址格式！" : "Please enter a valid address format!");
            return;
        }

        toolDefault.style.display = 'none';
        toolResult.style.display = 'none';
        toolLoading.style.display = 'flex';
        progressInner.style.width = '0%';

        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 20;
            if (progress > 100) progress = 100;
            progressInner.style.width = progress + '%';
            if (progress === 100) {
                clearInterval(interval);
                setTimeout(showResult, 400); 
            }
        }, 200);
    }

    function showResult() {
        toolLoading.style.display = 'none';
        toolResult.style.display = 'flex';

        const isSafe = Math.random() > 0.5;
        toolResult.className = 'tool-result';
        
        if (isSafe) {
            toolResult.classList.add('res-safe');
            resultText.innerHTML = `<strong>${currentLangDict.resSafe || 'Safe'}</strong><br><span style="color:var(--text-muted); font-size:13px;">${currentLangDict.resSafeDesc || ''}</span>`;
        } else {
            toolResult.classList.add('res-danger');
            resultText.innerHTML = `<strong>${currentLangDict.resDanger || 'Risk'}</strong><br><span style="color:var(--text-muted); font-size:13px;">${currentLangDict.resDangerDesc || ''}</span>`;
        }
    }

    function resetTool() {
        toolResult.style.display = 'none';
        toolLoading.style.display = 'none';
        toolDefault.style.display = 'flex'; 
        document.getElementById('walletAddress').value = '';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
