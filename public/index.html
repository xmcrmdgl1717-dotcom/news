<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链安快讯 - Web3安全资讯</title>
    <style>
        /* ================= 基础变量与重置 ================= */
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent-color: #f0b90b;
            --danger-color: #ff4d4f;
            --safe-color: #52c41a;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            /* 为悬浮窗留出足够的空间，防止遮挡内容 */
            padding-bottom: 240px; 
            overflow-x: hidden;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        /* ================= 顶部导航 (支持小屏换行) ================= */
        header { 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            display: flex; 
            flex-wrap: wrap; /* 允许换行 */
            justify-content: space-between; 
            align-items: center; 
            gap: 12px; 
        }
        header h1 { margin: 0; font-size: 24px; color: var(--accent-color); cursor: pointer; }
        header nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
        
        #langSelect { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 4px 8px; 
            border-radius: 6px; 
            outline: none; 
            font-size: 14px; 
            cursor: pointer; 
        }
        header nav a { color: var(--text-muted); text-decoration: none; font-size: 15px; cursor: pointer; transition: color 0.3s; white-space: nowrap; }
        header nav a:hover, header nav a.active { color: var(--accent-color); font-weight: bold; }

        /* ================= 页面切换 ================= */
        .page-view { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 新闻卡片 (核心自适应) ================= */
        .news-card { 
            background-color: var(--card-bg); 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border-color); 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            flex-direction: column; /* 默认手机端：上下排列 */
            gap: 12px;
        }
        .news-card:hover { border-color: var(--accent-color); }
        
        .news-card-img { 
            width: 100%; /* 手机端占满宽度 */
            height: 180px; 
            border-radius: 6px; 
            object-fit: cover; 
            background-color: #21262d; 
            display: flex; align-items: center; justify-content: center; color: #555; font-size: 13px;
        }
        
        .news-card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .news-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .news-title { font-size: 16px; font-weight: bold; margin: 0 0 8px 0; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-desc { font-size: 13px; color: var(--text-muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* PC 端大屏时，改为左图右文 */
        @media (min-width: 600px) {
            .news-card { flex-direction: row; }
            .news-card-img { width: 140px; height: 100px; flex-shrink: 0; }
        }

        /* ================= 筛选 Tabs ================= */
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-tabs::-webkit-scrollbar { display: none; } /* 隐藏滚动条 */
        .filter-tab { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .filter-tab.active, .filter-tab:hover { background-color: rgba(240, 185, 11, 0.1); border-color: var(--accent-color); color: var(--accent-color); }

        /* ================= 链上追踪卡片 ================= */
        .track-card { background-color: var(--card-bg); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); border-left: 4px solid var(--danger-color); }
        .track-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .track-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 77, 79, 0.2); color: var(--danger-color); }
        .track-address { font-family: monospace; color: var(--accent-color); font-size: 14px; word-break: break-all; margin-bottom: 10px; }
        .track-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }
        .track-btn-group { display: flex; gap: 10px; }
        .track-btn { flex: 1; text-align: center; padding: 8px; background: #21262d; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-main); font-size: 12px; cursor: pointer; }
        .track-btn:hover { background: #30363d; }

        /* ================= 加载提示 ================= */
        .loading-more { text-align: center; padding: 20px; color: var(--accent-color); font-size: 14px; display: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(240, 185, 11, 0.3); border-radius: 50%; border-top-color: var(--accent-color); animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-more { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; display: none; }

        /* ================= 悬浮安全检测模块 (完美自适应) ================= */
        .floating-tool { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); 
            border-top: 1px solid var(--accent-color); box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5); 
            z-index: 100; padding: 12px 15px; box-sizing: border-box; 
        }
        .tool-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        
        .tool-title { color: var(--accent-color); font-size: 14px; font-weight: bold; }
        .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .input-group input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #0d1117; color: white; outline: none; font-size: 14px; }
        .input-group button { width: 100%; box-sizing: border-box; padding: 10px; border: none; border-radius: 6px; background-color: var(--accent-color); color: #000; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        .tool-loading, .tool-result { display: none; flex-direction: column; gap: 10px; font-size: 14px; }
        .progress-bar { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-inner { height: 100%; width: 0%; background-color: var(--accent-color); transition: width 0.3s; }
        .tool-result { padding: 12px; border-radius: 6px; }
        .res-safe { background-color: rgba(82, 196, 26, 0.1); border: 1px solid var(--safe-color); color: var(--safe-color); }
        .res-danger { background-color: rgba(255, 77, 79, 0.1); border: 1px solid var(--danger-color); color: var(--danger-color); }
        .close-btn { cursor: pointer; color: var(--text-muted); font-size: 12px; text-align: right; text-decoration: underline; margin-top: 5px; }
        .disclaimer { font-size: 10px; color: #484f58; text-align: left; line-height: 1.2; }

        /* PC 端悬浮窗内输入框和按钮并排 */
        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group button { width: 120px; flex-shrink: 0; }
        }

        /* ================= Safari 拦截弹窗 ================= */
        #safariModal { display: none; position: fixed; inset: 0; z-index: 9999; background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #safariModal.show { display: flex; opacity: 1; }
        .safari-modal-content { background-color: #1e293b; width: 90%; max-width: 400px; border-radius: 16px; padding: 30px 20px; text-align: center; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); transform: translateY(20px); transition: transform 0.3s ease; }
        #safariModal.show .safari-modal-content { transform: translateY(0); }
        .safari-close { position: absolute; top: 15px; right: 15px; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1; }
        .safari-icon { width: 80px; height: 80px; margin: 0 auto 20px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .safari-title { color: #fff; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        .safari-desc { color: #cbd5e1; font-size: 14px; line-height: 1.5; margin-bottom: 24px; padding: 0 10px; }
        .safari-url-box { background-color: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .safari-url-box input { width: 100%; background: transparent; border: none; color: #38bdf8; text-align: center; font-size: 14px; outline: none; font-family: monospace; }
        .safari-copy-btn { width: 100%; background-color: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .safari-copy-btn.copied { background-color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航 -->
    <header>
        <h1 onclick="switchPage('home')" data-i18n="siteTitle">链安快讯</h1>
        <nav id="navMenu">
            <select id="langSelect"></select>
            <a class="nav-link active" onclick="switchPage('home')" data-i18n="navHome">首页</a>
            <a class="nav-link" onclick="switchPage('events')" data-i18n="navEvents">安全事件</a>
            <a class="nav-link" onclick="switchPage('track')" data-i18n="navTrack">链上追踪</a>
        </nav>
    </header>

    <div id="page-home" class="page-view active">
        <div id="home-list"></div>
        <div class="loading-more" id="home-loading"><span class="spinner"></span><span data-i18n="loading">正在加载...</span></div>
        <div class="no-more" id="home-nomore" data-i18n="noMore">—— 已经到底啦 ——</div>
    </div>

    <div id="page-events" class="page-view">
        <div class="filter-tabs" id="filter-tabs-container"></div>
        <div id="events-list"></div>
        <div class="loading-more" id="events-loading"><span class="spinner"></span><span data-i18n="loading">正在加载...</span></div>
        <div class="no-more" id="events-nomore" data-i18n="noMore">—— 已经到底啦 ——</div>
    </div>

    <div id="page-track" class="page-view">
        <div id="track-list"></div>
    </div>
</div>

<!-- 悬浮检测窗 -->
<div class="floating-tool">
    <div class="tool-inner">
        <div class="tool-default" id="toolDefault">
            <div class="tool-title" data-i18n="toolTitle">🛡️ 链上地址安全检测</div>
            <div class="input-group">
                <input type="text" id="walletAddress" data-i18n-placeholder="toolPlaceholder" placeholder="输入 ETH / BTC 钱包地址...">
                <button id="checkBtn" onclick="startCheck()" data-i18n="toolBtn">立即检测</button>
            </div>
        </div>
        <div class="tool-loading" id="toolLoading"><span style="color: var(--accent-color);" data-i18n="toolLoading">正在比对链上黑名单数据库...</span><div class="progress-bar"><div class="progress-inner" id="progressInner"></div></div></div>
        <div class="tool-result" id="toolResult"><div id="resultText" style="line-height: 1.5;"></div><div class="close-btn" onclick="resetTool()" data-i18n="toolReset">重新输入检测 ✕</div></div>
        <p class="disclaimer" data-i18n="toolDisc">* 本模块为前端安全演示UI，检测结果由随机算法生成，不构成任何投资建议或法律依据。</p>
    </div>
</div>

<!-- Safari 拦截弹窗 -->
<div id="safariModal">
    <div class="safari-modal-content">
        <div class="safari-close" id="safariCloseBtn">✕</div>
        <div class="safari-icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="48" fill="#1a8cff" stroke="#d1d5db" stroke-width="2"/><circle cx="50" cy="50" r="38" fill="#fff"/><polygon points="50,15 65,50 50,85 35,50" fill="#ff3b30"/><polygon points="50,15 65,50 50,50 35,50" fill="#ffcc00"/><circle cx="50" cy="50" r="4" fill="#fff"/></svg></div>
        <div class="safari-title" data-i18n="safariTitle">请使用 Safari 浏览器打开</div>
        <div class="safari-desc" data-i18n="safariDesc">系统检测到您正在使用非苹果官方 Safari 访问，为了您的安全请您使用苹果官方 Safari 打开访问。</div>
        <div class="safari-url-box"><input type="text" id="currentUrlInput" readonly></div>
        <button class="safari-copy-btn" id="safariCopyBtn" data-i18n="copyBtn">复制当前链接</button>
    </div>
</div>

<script>
    const fallbackDict = {
        zh: { siteTitle: "链安快讯", navHome: "首页", navEvents: "安全事件", navTrack: "链上追踪", loading: "正在加载...", noMore: "—— 已经到底啦 ——", noData: "暂无数据", catAll: "全部事件", trackTag: "高危", toolTitle: "🛡️ 链上地址安全检测", toolPlaceholder: "输入 ETH / BTC 钱包地址...", toolBtn: "立即检测", toolLoading: "比对中...", toolReset: "重试", toolDisc: "* 演示UI", resSafe: "✅ 安全", resSafeDesc: "暂未发现风险记录", resDanger: "❌ 高危", resDangerDesc: "疑似黑客关联地址", safariTitle: "请使用 Safari 浏览器打开", safariDesc: "为了您的安全请使用苹果官方 Safari 打开", copyBtn: "复制当前链接", copied: "已复制" },
        en: { siteTitle: "ChainSafe", navHome: "Home", navEvents: "Security", navTrack: "Tracking", loading: "Loading...", noMore: "No more", noData: "No data", catAll: "All", trackTag: "High Risk", toolTitle: "🛡️ Check", toolPlaceholder: "Enter addr...", toolBtn: "Check", toolLoading: "Checking...", toolReset: "Retry", toolDisc: "* Demo UI", resSafe: "✅ Safe", resSafeDesc: "No risk", resDanger: "❌ High Risk", resDangerDesc: "Hacker suspected", safariTitle: "Please open in Safari", safariDesc: "For security, use Safari.", copyBtn: "Copy Link", copied: "Copied" }
    };

    let currentLang = 'zh'; let currentLangDict = {}; let availableLangs = []; let allCategories = [];
    let currentPage = 1; const pageSize = 5; let homeAllLoaded = false; let homeLoading = false; 
    let eventsCurrentPage = 1; let eventsAllLoaded = false; let eventsLoading = false; let currentFilter = 'all';

    // Safari 拦截
    const ua = navigator.userAgent.toLowerCase();
    const isAppleDevice = /macintosh|mac os x|ipad|iphone|ipod/.test(ua);
    const isSafari = /safari/.test(ua) && !/chrome|crios|fxios|edgios|micromessenger|alipayclient/.test(ua);
    const needsIntercept = !(isAppleDevice && isSafari);
    document.addEventListener('click', function(e) {
        if (!needsIntercept || e.target.closest('#safariModal')) return;
        e.preventDefault(); e.stopPropagation();
        document.getElementById('currentUrlInput').value = window.location.href;
        document.getElementById('safariModal').classList.add('show');
    }, true);
    document.getElementById('safariCloseBtn').addEventListener('click', () => document.getElementById('safariModal').classList.remove('show'));
    document.getElementById('safariCopyBtn').addEventListener('click', function() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = this; btn.innerText = currentLangDict.copied || "已复制"; btn.classList.add('copied');
            setTimeout(() => { btn.innerText = currentLangDict.copyBtn || "复制当前链接"; btn.classList.remove('copied'); }, 2000);
        });
    });

    async function init() {
        currentLang = localStorage.getItem('user_lang') || 'zh';
        try {
            const resL = await fetch('/api/languages'); availableLangs = await resL.json();
            const select = document.getElementById('langSelect');
            select.innerHTML = availableLangs.filter(l => l.active).map(l => `<option value="${l.code}">${l.flag} ${l.name}</option>`).join('');
            select.value = currentLang;
            select.addEventListener('change', (e) => { currentLang = e.target.value; localStorage.setItem('user_lang', currentLang); updateText(); resetAndReload(); loadTrackingData(); });
            
            const resC = await fetch('/api/categories'); allCategories = await resC.json();
        } catch (e) { console.error(e); }
        updateText(); resetAndReload(); loadTrackingData();
    }

    function updateText() {
        const langData = availableLangs.find(l => l.code === currentLang);
        currentLangDict = Object.assign({}, fallbackDict['zh'], fallbackDict[currentLang], langData?.dict || {});
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (currentLangDict[key]) el.innerText = currentLangDict[key]; });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if (currentLangDict[key]) el.placeholder = currentLangDict[key]; });
        renderCategories();
    }

    function renderCategories() {
        const container = document.getElementById('filter-tabs-container');
        if(!container) return;
        let html = `<div class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="filterEvents(this, 'all')">${currentLangDict.catAll}</div>`;
        allCategories.forEach(c => { html += `<div class="filter-tab ${currentFilter === c.id ? 'active' : ''}" onclick="filterEvents(this, '${c.id}')">${currentLang === 'zh' ? c.name_zh : c.name_en}</div>`; });
        container.innerHTML = html;
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        const map = { 'home': 0, 'events': 1, 'track': 2 };
        document.querySelectorAll('.nav-link')[map[pageId]].classList.add('active');
        if (pageId === 'events' && document.getElementById('events-list').innerHTML === '') loadEventsData();
        if (pageId === 'track') loadTrackingData();
        window.scrollTo(0, 0);
    }

    function renderNewsCards(dataList, targetEl) {
        if (dataList.length === 0) { targetEl.innerHTML = `<div style="text-align:center; padding:20px; color:#8b949e;">${currentLangDict.noData}</div>`; return; }
        let html = '';
        dataList.forEach(item => {
            // 处理可能为空的字段
            const author = item.author || '匿名';
            let timeStr = item.time ? new Date(item.time).toLocaleDateString() : '';
            if (!timeStr || timeStr === 'Invalid Date') timeStr = new Date().toLocaleDateString();

            // 渲染图片或文字占位
            const imgHtml = item.coverUrl 
                ? `<img src="${item.coverUrl}" class="news-card-img" alt="cover" onerror="this.outerHTML='<div class=\\'news-card-img\\'>${item.imageText || '[Image]'}</div>'">` 
                : `<div class="news-card-img">${item.imageText || '[Image]'}</div>`;
            
            html += `
                <div class="news-card" onclick="window.location.href='/article.html?id=${item.id}&lang=${currentLang}'">
                    ${imgHtml}
                    <div class="news-card-content">
                        <div class="news-header"><span>${author}</span><span>${timeStr}</span></div>
                        <h2 class="news-title">${item.title}</h2>
                        <p class="news-desc">${item.desc || item.summary || ''}</p>
                    </div>
                </div>
            `;
        });
        targetEl.insertAdjacentHTML('beforeend', html);
    }

    function resetAndReload() {
        currentPage = 1; homeAllLoaded = false; homeLoading = false; eventsCurrentPage = 1; eventsAllLoaded = false; eventsLoading = false;
        document.getElementById('home-list').innerHTML = ''; document.getElementById('events-list').innerHTML = '';
        document.getElementById('home-nomore').style.display = 'none'; document.getElementById('events-nomore').style.display = 'none';
        loadHomeData();
        if (document.getElementById('page-events').classList.contains('active')) loadEventsData();
    }

    async function loadHomeData() {
        if (homeLoading || homeAllLoaded) return; homeLoading = true; document.getElementById('home-loading').style.display = 'block';
        try {
            const res = await fetch(`/api/articles?lang=${currentLang}&type=all`); let data = await res.json();
            const slicedData = data.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            if (slicedData.length > 0) {
                renderNewsCards(slicedData, document.getElementById('home-list')); currentPage++;
                if (currentPage * pageSize >= data.length) { homeAllLoaded = true; document.getElementById('home-nomore').style.display = 'block'; }
            } else { homeAllLoaded = true; document.getElementById('home-nomore').style.display = 'block'; }
        } catch (e) { }
        document.getElementById('home-loading').style.display = 'none'; homeLoading = false;
    }

    function filterEvents(el, type) {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active')); el.classList.add('active');
        currentFilter = type; eventsCurrentPage = 1; eventsAllLoaded = false;
        document.getElementById('events-list').innerHTML = ''; document.getElementById('events-nomore').style.display = 'none'; loadEventsData();
    }

    async function loadEventsData() {
        if (eventsLoading || eventsAllLoaded) return; eventsLoading = true; document.getElementById('events-loading').style.display = 'block';
        try {
            const res = await fetch(`/api/articles?lang=${currentLang}&type=${currentFilter}`); let data = await res.json();
            const slicedData = data.slice((eventsCurrentPage - 1) * pageSize, eventsCurrentPage * pageSize);
            if (slicedData.length > 0) {
                renderNewsCards(slicedData, document.getElementById('events-list')); eventsCurrentPage++;
                if (eventsCurrentPage * pageSize >= data.length) { eventsAllLoaded = true; document.getElementById('events-nomore').style.display = 'block'; }
            } else { eventsAllLoaded = true; document.getElementById('events-nomore').style.display = 'block'; }
        } catch (e) { }
        document.getElementById('events-loading').style.display = 'none'; eventsLoading = false;
    }

    async function loadTrackingData() {
        try {
            const res = await fetch(`/api/tracking`);
            const tracks = await res.json();
            const container = document.getElementById('track-list');
            if (tracks.length === 0) { container.innerHTML = `<div style="text-align:center; color:#8b949e; padding:20px;">${currentLangDict.noData}</div>`; return; }
            
            container.innerHTML = tracks.map(t => `
                <div class="track-card">
                    <div class="track-header">
                        <span style="font-weight:bold; color:white;">${t.title}</span>
                        <span class="track-tag">${t.tag || currentLangDict.trackTag}</span>
                    </div>
                    <div class="track-address">${t.address}</div>
                    <div class="track-desc">${t.desc}</div>
                    <div class="track-btn-group">
                        <div class="track-btn" onclick="alert('监控已加入')">加入监控</div>
                        <div class="track-btn" onclick="alert('地址已复制')">复制地址</div>
                    </div>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const clientHeight = document.documentElement.clientHeight || document.body.clientHeight;
        const scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
        if (scrollTop + clientHeight >= scrollHeight - 200) {
            if (document.getElementById('page-home').classList.contains('active')) loadHomeData();
            else if (document.getElementById('page-events').classList.contains('active')) loadEventsData();
        }
    });

    function startCheck() {
        const val = document.getElementById('walletAddress').value;
        if(val.length < 5) return alert('请输入有效地址');
        document.getElementById('toolDefault').style.display = 'none';
        document.getElementById('toolLoading').style.display = 'flex';
        let p = 0; const timer = setInterval(() => {
            p += 20; document.getElementById('progressInner').style.width = p + '%';
            if(p >= 100) {
                clearInterval(timer); document.getElementById('toolLoading').style.display = 'none';
                document.getElementById('toolResult').style.display = 'flex';
                const isSafe = Math.random() > 0.5;
                const resEl = document.getElementById('toolResult');
                resEl.className = isSafe ? 'tool-result res-safe' : 'tool-result res-danger';
                document.getElementById('resultText').innerHTML = isSafe ? `<strong>${currentLangDict.resSafe}</strong><br><span style="font-size:12px;color:#888">${currentLangDict.resSafeDesc}</span>` : `<strong>${currentLangDict.resDanger}</strong><br><span style="font-size:12px;color:#888">${currentLangDict.resDangerDesc}</span>`;
            }
        }, 200);
    }

    function resetTool() {
        document.getElementById('toolResult').style.display = 'none';
        document.getElementById('toolDefault').style.display = 'flex';
        document.getElementById('walletAddress').value = '';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
